services:
  mysql:
    image: mysql:8.0
    container_name: apm-demo-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-1234}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-apm_demo}
      MYSQL_USER: ${MYSQL_USER:-apm}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-1234}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-1234}"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:4.0.0
    container_name: apm-kafka
    restart: unless-stopped
    environment:
      # KRaft 단일 노드 (broker + controller 겸용, ZooKeeper 없음)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      # INTERNAL: 컨테이너 간(collector→kafka), EXTERNAL: 호스트(컨슈머 앱, CLI)
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # 단일 브로커라 복제 계수 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # 자동 생성 토픽 기본 파티션 수 (trace_id 키 분산 확인용)
      KAFKA_NUM_PARTITIONS: 3
      # 텔레메트리 버퍼 용도 — 컨슈머가 ClickHouse로 옮기므로 24시간이면 충분
      KAFKA_LOG_RETENTION_HOURS: 24
      # retention 삭제는 닫힌 세그먼트에만 적용 — 롤링 주기를 retention과 일치시켜야 24시간 삭제가 실제로 동작
      KAFKA_LOG_ROLL_MS: 86400000
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    container_name: apm-kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: apm-local
      # 같은 compose 네트워크의 INTERNAL 리스너로 접속 (EXTERNAL은 호스트 전용)
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      # ProtobufFile serde — OTLP 스키마로 value를 JSON 디코딩 (proto는 opentelemetry-proto v1.10.0)
      KAFKA_CLUSTERS_0_SERDE_0_NAME: ProtobufFile
      KAFKA_CLUSTERS_0_SERDE_0_PROPERTIES_PROTOBUFFILESDIR: /protofiles
      KAFKA_CLUSTERS_0_SERDE_0_PROPERTIES_PROTOBUFMESSAGENAMEBYTOPIC_TRACES: opentelemetry.proto.collector.trace.v1.ExportTraceServiceRequest
      KAFKA_CLUSTERS_0_SERDE_0_PROPERTIES_PROTOBUFMESSAGENAMEBYTOPIC_METRICS: opentelemetry.proto.collector.metrics.v1.ExportMetricsServiceRequest
    volumes:
      - ./kafka-ui/proto:/protofiles:ro
    ports:
      - "${KAFKA_UI_PORT:-8081}:8080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.156.0
    container_name: apm-otel-collector
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      # 이미지 기본 설정 경로에 마운트 (command 오버라이드 불필요)
      - ./otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "${OTEL_GRPC_PORT:-4317}:4317"     # OTLP gRPC
      - "${OTEL_HTTP_PORT:-4318}:4318"     # OTLP HTTP (Java Agent 기본 프로토콜 http/protobuf)
      - "${OTEL_HEALTH_PORT:-13133}:13133" # health_check extension
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  clickhouse:
    image: clickhouse/clickhouse-server:25.3.14.14
    container_name: apm-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-otel}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-apm}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-1234}
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"   # HTTP (clickhouse-client HTTP, Grafana)
      - "${CLICKHOUSE_TCP_PORT:-9000}:9000"    # native TCP (컨슈머 앱 드라이버)
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      # 볼륨이 비어 있을 때 첫 기동 1회만 실행 (파일명 순 01→02)
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      # /ping 은 인증 불필요 — 계정 설정과 무관하게 동작
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mysql-data:
  kafka-data:
  clickhouse-data:
