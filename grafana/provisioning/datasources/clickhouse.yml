# ClickHouse datasource 자동 등록 — 수동 설정 없이 compose up만으로 연결
# $CLICKHOUSE_* 는 grafana 컨테이너 환경변수에서 보간 (docker-compose.yml에서 전달)
apiVersion: 1

datasources:
  - name: ClickHouse
    type: grafana-clickhouse-datasource
    # 대시보드 JSON이 이 uid로 datasource를 참조 — 변경 시 대시보드 3종도 함께 수정
    uid: clickhouse-otel
    access: proxy
    isDefault: true
    jsonData:
      # 같은 compose 네트워크의 HTTP 인터페이스
      host: clickhouse
      port: 8123
      protocol: http
      secure: false
      username: $CLICKHOUSE_USER
      defaultDatabase: $CLICKHOUSE_DB
    secureJsonData:
      password: $CLICKHOUSE_PASSWORD
